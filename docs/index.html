<!doctype html>
<html lang="vi">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Lợi ích của công nghệ số — Infographic & Video</title>
    <style>
        body{font-family:Arial,Helvetica,sans-serif;margin:20px;background:#f5f7fb;color:#222}
        .container{max-width:900px;margin:0 auto}
        header h1{margin:0 0.25rem 8px;font-size:1.6rem;text-align:center}
        .lead{color:#444;text-align:center;margin-bottom:18px}
        .media{background:#fff;padding:18px;border-radius:8px;box-shadow:0 6px 18px rgba(20,30,50,.06)}
        figure{margin:0 0 16px}
        img.infographic{width:100%;height:auto;border-radius:6px;display:block}
        .video-wrap{position:relative;padding-top:56.25%}
        video{position:absolute;inset:0;width:100%;height:100%;border-radius:6px;background:#000}
        figcaption.desc{font-size:0.95rem;color:#555;margin-top:8px}
        footer{margin-top:18px;text-align:center;color:#666;font-size:.9rem}
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>Lợi ích của công nghệ số</h1>
            <p class="lead">Tổng quan ngắn về cách công nghệ số nâng cao hiệu suất, kết nối cộng đồng và thúc đẩy đổi mới.</p>
        </header>

        <div class="media">
            <figure>
                <img class="infographic" 
                     src="https://raw.githubusercontent.com/ntranbao1103/ThucHanh5_Nhom5_E07/main/NhiemVu2/ThucHanh5_2.1_Ngh%C4%A9a.png" 
                     alt="Infographic: Lợi ích của công nghệ số" />
                <figcaption class="desc">Infographic minh họa các lợi ích của công nghệ số trong giáo dục và đời sống.</figcaption>
            </figure>

            <figure>
                <div class="video-wrap">
                    <video controls preload="metadata" 
                           poster="https://raw.githubusercontent.com/ntranbao1103/ThucHanh5_Nhom5_E07/main/NhiemVu2/ThucHanh5_2.1_Ngh%C4%A9a.png">
                        <source src="https://raw.githubusercontent.com/ntranbao1103/ThucHanh5_Nhom5_E07/main/NhiemVu2/ThucHanh5_2.2_B%E1%BB%99iNg%E1%BB%8Dc.mp4" type="video/mp4" />
                        Trình duyệt của bạn không hỗ trợ thẻ video. 
                        <a href="https://raw.githubusercontent.com/ntranbao1103/ThucHanh5_Nhom5_E07/main/NhiemVu2/ThucHanh5_2.2_B%E1%BB%99iNg%E1%BB%8Dc.mp4">Tải video tại đây.</a>
                    </video>
                </div>
                <figcaption class="desc">Video minh họa các ứng dụng thực tiễn của công nghệ số trong học tập và công việc.</figcaption>
            </figure>
        </div>

        <footer>
            <p>&copy; 2025 Infographic và Video. All rights reserved.</p>
        </footer>
    </div>
</body>
</html>
